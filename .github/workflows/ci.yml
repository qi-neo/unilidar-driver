name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上新的推送取消正在跑的旧任务，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: 依赖声明一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rosdep 的唯一依据是 package.xml。CMakeLists 里 find_package 了但
      # package.xml 没声明的，在开发机上看不出来（别的包或全局环境已经装上），
      # 到了干净环境里 rosdep 不装它才炸。v1.0.0 就因为漏声明 geometry_msgs
      # 发布过一版装不全依赖的包，所以这里加一道纯文本检查，不需要 ROS。
      - name: CMakeLists 与 package.xml 对齐
        run: python3 tools/check_deps.py

  core:
    name: 核心库自检（${{ matrix.cxx }}${{ matrix.sanitizer == 'asan' && ' + ASan/UBSan' || '' }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [clang++, g++]
        sanitizer: ["", "asan"]
    steps:
      - uses: actions/checkout@v4

      # 核心库不依赖 ROS，也不需要 PCL，所以这里不用装任何东西，
      # 一条编译命令加一次执行就能覆盖协议、解析、解码三层。
      - name: 编译并运行 202 项离线自检
        run: |
          set -e
          EXTRA=""
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          fi
          ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Wpedantic -Werror -O1 $EXTRA \
            -I src/unilidar_driver/include \
            src/unilidar_driver/examples/decoder_selftest.cpp \
            src/unilidar_driver/src/protocol.cpp \
            src/unilidar_driver/src/packet_parser.cpp \
            src/unilidar_driver/src/frame_decoder.cpp \
            -o decoder_selftest
          # 开了 ASan 时顺便查泄漏；没开时这个变量被忽略
          ASAN_OPTIONS=detect_leaks=1 ./decoder_selftest

      - name: 编译并运行 81 项串口接收自检（PTY 虚拟串口；macOS 无 B2000000 常量为 80 项）
        run: |
          set -e
          EXTRA=""
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          fi
          # SerialReceiver 走的是与 /dev/ttyUSB0 完全相同的 termios 路径，
          # 这里用 PTY 主从对模拟，不依赖真雷达也不依赖真串口。
          ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Wpedantic -Werror -O1 $EXTRA \
            -I src/unilidar_driver/include \
            src/unilidar_driver/examples/serial_receiver_selftest.cpp \
            src/unilidar_driver/src/protocol.cpp \
            src/unilidar_driver/src/packet_parser.cpp \
            src/unilidar_driver/src/serial_receiver.cpp \
            -o serial_receiver_selftest
          ASAN_OPTIONS=detect_leaks=1 ./serial_receiver_selftest

      # 压力自检把「CH340 需实测」缩小到只剩物理层误码率：PTY 主端按 2 Mbps
      # 灌 60 秒合成报文（本 CI 取 3 秒），同时掺垃圾字节与伪帧头、周期性读
      # 暂停制造瞬态背压，核验零丢失、零误判、缓冲有界、内存平稳。
      # 这条同时守护 packet_parser 的坏帧恢复路径——该路径的 pos 重置 bug
      # 正是本测试最先发现的（每次注入后丢一整帧）。
      - name: 编译并运行 14 项串口压力自检（2 Mbps 灌入 3 s）
        run: |
          set -e
          EXTRA=""
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          fi
          ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Wpedantic -Werror -O1 $EXTRA \
            -I src/unilidar_driver/include \
            src/unilidar_driver/examples/serial_stress_selftest.cpp \
            src/unilidar_driver/src/protocol.cpp \
            src/unilidar_driver/src/packet_parser.cpp \
            src/unilidar_driver/src/serial_receiver.cpp \
            -o serial_stress_selftest
          ASAN_OPTIONS=detect_leaks=1 ./serial_stress_selftest --seconds 3 --quiet

      # 节点主循环（收包→定界→解码→拼帧）已抽成不依赖 ROS 的 DriverLoop，
      # 节点把发布当回调塞进去，所以这段能在这里离线实测：吞吐、单轮耗时
      # 分布、定界缓冲深度、超载整批丢弃与恢复、读错误恢复、深积压读满上限、
      # 空云线与半圈丢弃、统计复位语义、重复线端到端。跑的是真机上跑的同一份代码。
      - name: 编译并运行 65 项节点主循环自检（2 Mbps，2 s）
        run: |
          set -e
          EXTRA=""
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          fi
          ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Wpedantic -Werror -O1 $EXTRA \
            -I src/unilidar_driver/include \
            src/unilidar_driver/examples/node_loop_selftest.cpp \
            src/unilidar_driver/src/protocol.cpp \
            src/unilidar_driver/src/packet_parser.cpp \
            src/unilidar_driver/src/frame_decoder.cpp \
            src/unilidar_driver/src/serial_receiver.cpp \
            src/unilidar_driver/src/driver_loop.cpp \
            -o node_loop_selftest
          ASAN_OPTIONS=detect_leaks=1 ./node_loop_selftest --seconds 2 --quiet

      # B1 真机误码率/长稳 bench 的离线自检：不碰硬件，用合成流验证解析链路
      # 计数与报告生成路径。接真雷达时用 --device /dev/ttyUSB0 --duration 7200 出物理层报告。
      - name: 编译并运行 B1 误码率 bench 离线自检（合成流）
        run: |
          set -e
          EXTRA=""
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          fi
          ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Wpedantic -Werror -O1 $EXTRA \
            -I src/unilidar_driver/include -I src/unilidar_driver/examples \
            src/unilidar_driver/examples/hardware_ber_bench.cpp \
            src/unilidar_driver/src/protocol.cpp \
            src/unilidar_driver/src/packet_parser.cpp \
            src/unilidar_driver/src/frame_decoder.cpp \
            src/unilidar_driver/src/serial_receiver.cpp \
            -o hardware_ber_bench
          ASAN_OPTIONS=detect_leaks=1 ./hardware_ber_bench --selftest --quiet

      # B2 四元数一键判定：判定逻辑的离线自检（ROS-free）。ROS 节点本身在 ros job 编译。
      - name: 编译并运行 B2 四元数判定自检（65 项）
        run: |
          set -e
          EXTRA=""
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          fi
          ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Wpedantic -Werror -O1 $EXTRA \
            -I src/unilidar_driver/include \
            src/unilidar_driver/examples/quat_check_selftest.cpp \
            src/unilidar_driver/src/protocol.cpp \
            src/unilidar_driver/src/packet_parser.cpp \
            src/unilidar_driver/src/frame_decoder.cpp \
            -o quat_check_selftest
          ASAN_OPTIONS=detect_leaks=1 ./quat_check_selftest

  ros:
    name: ROS 节点编译（Humble 容器）
    runs-on: ubuntu-latest
    # 上面两个 job 只编译不依赖 ROS 的核心库，ROS 节点从未进过 CI：
    # rclcpp API 用错、package.xml 漏依赖、CMake 链接问题都只能在用户机器上暴露。
    # 这里用官方 Humble 基础镜像真正 colcon build 一遍节点。
    container:
      image: ros:humble-ros-base
    defaults:
      run:
        # 容器 job 默认用 sh，而 source /opt/ros/... 需要 bash
        shell: bash
    steps:
      # 官方镜像不保证带 git / colcon / rosdep，而 actions/checkout 自己就依赖 git，
      # 所以先装工具再 checkout。这一步不需要仓库文件，放在 checkout 之前是安全的。
      - name: 安装 git / colcon / rosdep / 编译工具
        run: |
          set -eo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git build-essential cmake python3-colcon-common-extensions python3-rosdep
          # 容器里以 root 跑，checkout 的工作区可能与当前用户不同属，先放行
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: rosdep 安装依赖并 colcon build
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          # 官方镜像里 rosdep 的源列表不一定初始化过，缺了就补一次
          if [ ! -e /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update
          # 按 package.xml 装齐 rclcpp / sensor_msgs / tf2 / tf2_ros / geometry_msgs
          # 等依赖。漏声明在这里就会暴露，比在用户机器上炸强。
          rosdep install --from-paths src --ignore-src -r -y
          colcon build --packages-select unilidar_driver --event-handlers console_direct+

      - name: 确认产物可执行并验证参数校验
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          BIN=install/unilidar_driver/lib/unilidar_driver
          test -x "$BIN/unilidar_driver_node"
          test -x "$BIN/decoder_selftest"
          test -x "$BIN/serial_receiver_selftest"
          test -x "$BIN/serial_stress_selftest"
          test -x "$BIN/node_loop_selftest"
          test -x "$BIN/quat_check_selftest"
          test -x "$BIN/quat_check"
          # 装出来的自检也能跑，确认没有链接问题
          "$BIN/decoder_selftest"
          # 串口自检用 PTY 虚拟串口，容器里同样可跑
          "$BIN/serial_receiver_selftest"
          # 压力自检取 3 秒，容器里灌入速率同样跑得满 2 Mbps
          "$BIN/serial_stress_selftest" --seconds 3 --quiet
          # 节点主循环自检同样在容器里跑（真机跑的就是这份 DriverLoop）
          "$BIN/node_loop_selftest" --seconds 2 --quiet
          # B2 四元数判定自检（ROS-free 判定逻辑，ROS 节点已一并编译）
          "$BIN/quat_check_selftest"

          # 参数校验要 FATAL 后以非 0 退出，而不是静默回退：用非法 quaternion_order
          # 启动节点，期望进程失败且日志里出现「参数非法」。这条同时验证了节点能真正跑起来。
          set +e
          OUT=$(timeout 20 "$BIN/unilidar_driver_node" --ros-args -p quaternion_order:=illegal 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "参数校验未生效：quaternion_order=illegal 时节点仍以退出码 0 结束"
            exit 1
          fi
          if ! printf '%s' "$OUT" | grep -q "参数非法"; then
            echo "节点非 0 退出，但不是因为参数校验失败（日志中没有『参数非法』）"
            exit 1
          fi
